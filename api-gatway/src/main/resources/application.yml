spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          #User Service
           - id: user-service
             uri: lb://user-service
             predicates:
               - Path=/api/v1/users/**
           #Product Service
           - id: product-service
             uri: lb://product-service
             predicates:
              - Path=/api/v1/products/**
            #order service
           - id: order-service
             uri: lb://order-service
             predicates:
              - Path=/api/v1/orders/**
server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
